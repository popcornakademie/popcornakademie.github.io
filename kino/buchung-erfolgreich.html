<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Buchung erfolgreich – Court Side Kino</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/layout.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/animations.css">

        <div style="font-size:4rem;margin-bottom:var(--space-lg);" aria-hidden="true">🎬</div>

        <div id="booking-details" class="qr-display" style="margin:var(--space-2xl) 0;">

        </div>

        <div class="no-print" style="display:flex;gap:var(--space-md);justify-content:center;flex-wrap:wrap;margin-top:var(--space-xl);">
          <button onclick="window.print()" class="btn btn--outline">Ticket drucken</button>

        </div>
      </div>
    </div></section>
